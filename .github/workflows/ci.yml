name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: npm run build:firefox
      - run: npm run zip:firefox
      - run: npm run build
      - uses: actions/upload-artifact@v4
        with:
          name: firefox-zip
          path: .output/*.zip
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        with:
          name: chrome-zip
          path: .output/chrome-mv3.zip
          if-no-files-found: ignore
