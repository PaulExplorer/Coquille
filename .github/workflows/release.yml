name: Release

on:
  push:
    tags:
      - "v*"

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      AMO_API_KEY: ${{ secrets.AMO_JWT_ISSUER }}
      AMO_API_SECRET: ${{ secrets.AMO_SSO_JWT }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Check that the tag matches package.json
        # The tag drives the release name and the zips must carry the same
        # version in their manifest, so the two sources must agree.
        run: |
          PKG_VERSION=$(node -p "require('./package.json').version")
          TAG_VERSION=${GITHUB_REF_NAME#v}
          if [ "$TAG_VERSION" != "$PKG_VERSION" ]; then
            echo "tag $GITHUB_REF_NAME but package.json says $PKG_VERSION" >&2
            echo "bump package.json first, or point a corrected tag at this commit" >&2
            exit 1
          fi
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: npm run smoke:engine
      - name: Build Firefox package (web-ext, AMO-ready)
        run: npm run zip:firefox
      - name: Build Chrome package
        run: npx wxt zip -b chrome
      - name: Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            .output/*.zip
          generate_release_notes: true
      - name: Sign and submit to AMO
        # Optional: only runs when AMO credentials are configured in the
        # repository secrets (AMO_JWT_ISSUER + AMO_SSO_JWT).
        if: env.AMO_API_KEY != '' && env.AMO_API_SECRET != ''
        run: |
          npx web-ext sign \
            --source-dir .output/firefox-mv3 \
            --api-key "$AMO_API_KEY" \
            --api-secret "$AMO_API_SECRET" \
            --channel listed \
            || echo "AMO submission failed; the zip stays on the release"
